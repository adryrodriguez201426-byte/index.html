<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aventura Matemática</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#87CEEB;
    text-align:center;
    padding:20px;
}

#game{
    max-width:700px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 10px gray;
}

h1{
    color:#2c3e50;
}

.info{
    display:flex;
    justify-content:space-around;
    margin-bottom:20px;
    font-size:20px;
    font-weight:bold;
}

#question{
    font-size:28px;
    margin:25px 0;
}

input{
    font-size:22px;
    padding:10px;
    width:150px;
    text-align:center;
}

button{
    padding:10px 20px;
    font-size:20px;
    margin-top:10px;
    cursor:pointer;
    background:#27ae60;
    color:white;
    border:none;
    border-radius:8px;
}

button:hover{
    background:#219150;
}

#message{
    font-size:22px;
    margin-top:15px;
    font-weight:bold;
}
</style>
</head>

<body>

<div id="game">

<h1>🏆 Aventura Matemática 🏆</h1>

<div class="info">
<div>⭐ Puntos: <span id="score">0</span></div>
<div>❤️ Vidas: <span id="lives">3</span></div>
<div>🚀 Nivel: <span id="level">1</span></div>
</div>

<div id="question"></div>

<input type="number" id="answer">

<br>

<button onclick="checkAnswer()">Responder</button>

<div id="message"></div>

</div>

<script>

let score = 0;
let lives = 3;
let level = 1;

let currentAnswer = 0;

function generateQuestion(){

    let question = "";

    if(level === 1){

        const num = Math.floor(Math.random()*100)+100;

        const type = Math.floor(Math.random()*2);

        if(type === 0){
            question = `¿Cuál es el número anterior a ${num}?`;
            currentAnswer = num - 1;
        }else{
            question = `¿Cuál es el número posterior a ${num}?`;
            currentAnswer = num + 1;
        }

    }

    else if(level === 2){

        let a = Math.floor(Math.random()*50)+100;
        let b = Math.floor(Math.random()*30)+1;

        question = `${a} + ${b} = ?`;
        currentAnswer = a + b;

    }

    else if(level === 3){

        let a = Math.floor(Math.random()*80)+120;
        let b = Math.floor(Math.random()*30)+1;

        question = `${a} - ${b} = ?`;
        currentAnswer = a - b;
    }

    else if(level === 4){

        let inicio = Math.floor(Math.random()*50)+100;

        question =
        `${inicio}, ${inicio+10}, ${inicio+20}, ___`;

        currentAnswer = inicio + 30;
    }

    else if(level === 5){

        let a = Math.floor(Math.random()*50)+100;
        let b = a + 1;

        question = `Si un número es ${a}, ¿cuál es su posterior?`;
        currentAnswer = b;
    }

    document.getElementById("question").innerHTML = question;
    document.getElementById("answer").value="";
}

function checkAnswer(){

    let userAnswer =
    parseInt(document.getElementById("answer").value);

    if(userAnswer === currentAnswer){

        score += 10;

        document.getElementById("message").innerHTML =
        "✅ ¡Correcto!";

        if(score % 50 === 0 && level < 5){

            level++;

            alert("🎉 ¡Subiste al nivel " + level + "!");
        }

    }else{

        lives--;

        document.getElementById("message").innerHTML =
        "❌ Incorrecto";

    }

    document.getElementById("score").textContent = score;
    document.getElementById("lives").textContent = lives;
    document.getElementById("level").textContent = level;

    if(lives <= 0){

        document.getElementById("question").innerHTML =
        "💀 Fin del juego";

        document.getElementById("message").innerHTML =
        "Puntaje final: " + score;

        return;
    }

    if(level === 5 && score >= 250){

        document.getElementById("question").innerHTML =
        "🏆 ¡Encontraste el tesoro matemático!";

        document.getElementById("message").innerHTML =
        "¡Ganaste con " + score + " puntos!";

        return;
    }

    generateQuestion();
}

generateQuestion();

</script>

</body>
</html>
